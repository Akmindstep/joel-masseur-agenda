<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenFlow Massage - Réservation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs (Compat versions for easier global usage in single-file HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Configuration Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyDV_kmvQC6yAtA95efs33S17SiYopp0r2c",
            authDomain: "ak-minstep-consult-tracker.firebaseapp.com",
            projectId: "ak-minstep-consult-tracker",
            storageBucket: "ak-minstep-consult-tracker.firebasestorage.app",
            messagingSenderId: "1076236018116",
            appId: "1:1076236018116:web:43bc905a807e0410528491"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "massage-booking-zenflow-sync";

        // Composant d'icônes Lucide
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const DEFAULT_MASSAGES = [
            { id: 'relax', name: 'Massage Relaxant', duration: 60, price: 70 },
            { id: 'deep', name: 'Deep Tissue', duration: 60, price: 85 },
            { id: 'sport', name: 'Massage Sportif', duration: 45, price: 65 },
        ];

        const MONTHS_FR = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('client'); 
            const [adminSubView, setAdminSubView] = useState('list');
            const [appointments, setAppointments] = useState([]);
            const [dailySlots, setDailySlots] = useState({}); 
            const [massageTypes, setMassageTypes] = useState([]);
            const [businessSettings, setBusinessSettings] = useState({ whatsapp: "33600000000" });
            
            const [step, setStep] = useState(1);
            const [selectedService, setSelectedService] = useState(null);
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [selectedTime, setSelectedTime] = useState(null);
            const [formData, setFormData] = useState({ name: '', phone: '', notes: '' });
            const [loading, setLoading] = useState(false);
            const [isSyncing, setIsSyncing] = useState(true);

            // Authentification
            useEffect(() => {
                auth.signInAnonymously().catch(err => console.error("Auth error:", err));
                const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
                return () => unsubscribe();
            }, []);

            // Synchronisation Firestore
            useEffect(() => {
                if (!user) return;
                setIsSyncing(true);

                // Rendez-vous (Public)
                const aptsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments');
                const unsubApts = aptsRef.onSnapshot((snap) => {
                    setAppointments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsSyncing(false);
                });

                // Disponibilités
                const availDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('availability');
                const unsubAvail = availDoc.onSnapshot((snap) => {
                    if (snap.exists) setDailySlots(snap.data().slots || {});
                });

                // Configuration
                const settingsDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('config');
                const unsubSettings = settingsDoc.onSnapshot((snap) => {
                    if (snap.exists) setBusinessSettings(snap.data());
                });

                // Services
                const servicesDoc = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('services');
                const unsubServices = servicesDoc.onSnapshot((snap) => {
                    if (snap.exists) setMassageTypes(snap.data().list || DEFAULT_MASSAGES);
                    else {
                        servicesDoc.set({ list: DEFAULT_MASSAGES });
                        setMassageTypes(DEFAULT_MASSAGES);
                    }
                });

                return () => { unsubApts(); unsubAvail(); unsubSettings(); unsubServices(); };
            }, [user]);

            const getDateStr = (d) => d.toISOString().split('T')[0];

            const getAvailableSlots = (date) => {
                const s = getDateStr(date);
                const slots = dailySlots[s] || [];
                const booked = appointments.filter(a => String(a.date) === s).map(a => String(a.time));
                return slots.filter(t => !booked.includes(t)).sort();
            };

            const openWhatsApp = (booking) => {
                const phone = businessSettings.whatsapp || "33600000000";
                const dateFmt = new Date(booking.date).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
                const text = `Bonjour ! Nouveau RDV massage 💆‍♂️%0A%0A*Client:* ${booking.name}%0A*Soin:* ${booking.serviceName}%0A*Date:* ${dateFmt}%0A*Heure:* ${booking.time}%0A*Tél:* ${booking.phone}`;
                window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
            };

            const handleBooking = async () => {
                setLoading(true);
                const booking = {
                    name: formData.name,
                    phone: formData.phone,
                    notes: formData.notes,
                    serviceName: selectedService.name,
                    date: getDateStr(selectedDate),
                    time: selectedTime,
                    createdAt: new Date().toISOString(),
                    isNew: true
                };
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments').add(booking);
                    setStep(4);
                } catch (e) {
                    console.error("Booking error:", e);
                } finally {
                    setLoading(false);
                }
            };

            const markRead = async (id) => {
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments').doc(id).update({ isNew: false });
            };

            if (view === 'client') {
                return (
                    <div className="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col border-x border-slate-100 animate-fade-in">
                        <div className="bg-emerald-800 p-8 text-white text-center shadow-lg">
                            <h1 className="text-3xl font-serif font-bold tracking-tight mb-1">ZenFlow</h1>
                            <p className="text-emerald-100/80 text-[10px] font-bold uppercase tracking-[0.2em]">Massage & Sérénité</p>
                        </div>

                        <div className="p-6 flex-grow overflow-y-auto">
                            {step === 1 && (
                                <div className="space-y-4">
                                    <h2 className="text-xl font-semibold text-slate-800 mb-8 text-center font-serif">Quel soin désirez-vous ?</h2>
                                    {massageTypes.map(s => (
                                        <button key={s.id} onClick={() => { setSelectedService(s); setStep(2); }} className="w-full text-left p-5 bg-white border border-slate-100 rounded-3xl hover:border-emerald-200 transition-all flex justify-between items-center group shadow-sm active:scale-95">
                                            <div>
                                                <h3 className="font-bold text-slate-800 text-lg">{s.name}</h3>
                                                <p className="text-xs text-slate-400 font-bold">{s.duration} min • {s.price}€</p>
                                            </div>
                                            <Icon name="chevron-right" size={24} className="text-slate-200 group-hover:text-emerald-600" />
                                        </button>
                                    ))}
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6">
                                    <button onClick={() => setStep(1)} className="text-xs font-bold text-emerald-700 flex items-center gap-1"><Icon name="chevron-left" size={16}/> Retour aux soins</button>
                                    <div className="bg-slate-50 p-5 rounded-[2.5rem] border border-slate-100">
                                        <div className="flex justify-between items-center mb-6 text-[10px] font-black uppercase text-slate-400">
                                            <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate() - 7); setSelectedDate(d); }}><Icon name="chevron-left"/></button>
                                            <span>{MONTHS_FR[selectedDate.getMonth()]} {selectedDate.getFullYear()}</span>
                                            <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate() + 7); setSelectedDate(d); }}><Icon name="chevron-right"/></button>
                                        </div>
                                        <div className="grid grid-cols-7 gap-1">
                                            {[...Array(7)].map((_, i) => {
                                                const d = new Date(selectedDate); d.setDate(selectedDate.getDate() - selectedDate.getDay() + i);
                                                const isSel = d.toDateString() === selectedDate.toDateString();
                                                const hasS = getAvailableSlots(d).length > 0;
                                                const isPast = d < new Date(new Date().setHours(0,0,0,0));
                                                return (
                                                    <button key={i} disabled={isPast || !hasS} onClick={() => setSelectedDate(d)} className={`aspect-square flex flex-col items-center justify-center rounded-2xl text-xs transition-all ${isSel ? 'bg-emerald-600 text-white shadow-lg' : 'hover:bg-emerald-50'} ${(!hasS || isPast) ? 'opacity-10 cursor-not-allowed' : 'font-black text-slate-700'}`}>
                                                        {d.getDate()}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2 py-4">
                                        {getAvailableSlots(selectedDate).map((time, idx) => (
                                            <button key={idx} onClick={() => setSelectedTime(time)} className={`py-4 border-2 rounded-2xl text-xs font-black transition-all ${selectedTime === time ? 'bg-emerald-600 border-emerald-600 text-white shadow-md' : 'bg-white border-slate-50 text-slate-500'}`}>{time}</button>
                                        ))}
                                    </div>
                                    {selectedTime && <button onClick={() => setStep(3)} className="w-full bg-emerald-600 text-white py-5 rounded-[2rem] font-bold shadow-xl active:scale-95">Suivant</button>}
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6">
                                    <button onClick={() => setStep(2)} className="text-xs font-bold text-emerald-700 flex items-center gap-1"><Icon name="chevron-left" size={16}/> Retour</button>
                                    <div className="space-y-4">
                                        <input type="text" className="w-full p-5 bg-slate-50 rounded-[1.5rem] text-sm outline-none" placeholder="Votre nom complet" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                        <input type="tel" className="w-full p-5 bg-slate-50 rounded-[1.5rem] text-sm outline-none" placeholder="Téléphone (ex: 06...)" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} />
                                        <textarea className="w-full p-5 bg-slate-50 rounded-[1.5rem] min-h-[100px] text-sm outline-none" placeholder="Notes pour le praticien..." value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} />
                                    </div>
                                    <button disabled={!formData.name || !formData.phone || loading} onClick={handleBooking} className="w-full bg-emerald-600 text-white py-5 rounded-[2rem] font-bold shadow-xl active:scale-95 disabled:bg-slate-200 transition-colors">
                                        {loading ? "Chargement..." : "Confirmer le rendez-vous"}
                                    </button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="text-center py-12 space-y-8">
                                    <div className="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto text-emerald-600 shadow-inner">
                                        <Icon name="check-circle" size={48} />
                                    </div>
                                    <h2 className="text-3xl font-serif font-bold text-slate-800">Réservé !</h2>
                                    <p className="text-slate-500 text-sm">Veuillez envoyer la confirmation par WhatsApp pour finaliser le rendez-vous.</p>
                                    <button onClick={() => openWhatsApp({ name: formData.name, serviceName: selectedService.name, time: selectedTime, date: selectedDate, phone: formData.phone })} className="w-full bg-[#25D366] text-white py-5 rounded-[2rem] font-black text-xs uppercase flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-all">
                                        <Icon name="message-square" /> Envoyer sur WhatsApp
                                    </button>
                                    <button onClick={() => setStep(1)} className="text-slate-400 font-bold text-[10px] uppercase tracking-widest hover:text-emerald-700">Prendre un autre RDV</button>
                                </div>
                            )}
                        </div>
                        <div className="p-4 border-t bg-slate-50 text-center">
                            <button onClick={() => setView('admin')} className="text-[10px] font-bold text-slate-300 uppercase tracking-widest hover:text-emerald-600 transition-colors">Espace Praticien</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto p-6 md:p-10 min-h-screen animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
                        <div>
                            <h1 className="text-4xl font-serif font-bold text-gray-900 flex items-center gap-3">
                                Admin ZenFlow 
                                {appointments.some(a => a.isNew) && <Icon name="bell" className="text-red-500 animate-bounce" />}
                            </h1>
                            <div className="flex gap-8 mt-6">
                                {[{id:'list', l:'Agenda'}, {id:'availability', l:'Planning'}, {id:'settings', l:'Soins'}].map(t => (
                                    <button key={t.id} onClick={() => setAdminSubView(t.id)} className={`text-[10px] font-black uppercase tracking-widest pb-3 border-b-2 transition-all ${adminSubView === t.id ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-400'}`}>{t.l}</button>
                                ))}
                            </div>
                        </div>
                        <button onClick={() => setView('client')} className="px-6 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-bold shadow-sm active:scale-95 transition-all hover:bg-slate-50">Vue Client</button>
                    </div>

                    {adminSubView === 'list' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {appointments.length === 0 ? <p className="col-span-full text-center py-20 text-slate-300 italic">Aucun rendez-vous enregistré.</p> : 
                                [...appointments].sort((a,b) => new Date(a.date+' '+a.time) - new Date(b.date+' '+b.time)).map(apt => (
                                    <div key={apt.id} onClick={() => markRead(apt.id)} className={`bg-white p-6 rounded-[2rem] border ${apt.isNew ? 'border-emerald-400 bg-emerald-50/20' : 'border-slate-100'} flex justify-between items-start group shadow-sm transition-all hover:shadow-md cursor-pointer`}>
                                        <div className="flex gap-4">
                                            <div className="bg-emerald-50 text-emerald-700 p-3 rounded-2xl flex flex-col items-center min-w-[70px]">
                                                <span className="text-2xl font-black">{new Date(apt.date).getDate()}</span>
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-slate-800">{apt.name}</h3>
                                                <p className="text-emerald-600 font-bold text-xs">{apt.time} • {apt.serviceName}</p>
                                                <p className="text-[10px] text-slate-400 mt-1">{apt.phone}</p>
                                            </div>
                                        </div>
                                        <button onClick={(e) => { e.stopPropagation(); if(confirm("Supprimer ce rendez-vous ?")) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments').doc(apt.id).delete(); }} className="text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="trash-2" /></button>
                                    </div>
                                ))
                            }
                        </div>
                    )}

                    {adminSubView === 'availability' && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                                <h3 className="font-serif font-bold text-lg mb-6">Gestion des dates</h3>
                                <div className="grid grid-cols-7 gap-3">
                                    {[...Array(35)].map((_, i) => {
                                        const d = new Date(); d.setDate(d.getDate() + i - 2);
                                        const s = getDateStr(d);
                                        const isSel = s === getDateStr(adminSelectedDate);
                                        const hasS = dailySlots[s]?.length > 0;
                                        return <button key={i} onClick={() => setAdminSelectedDate(d)} className={`aspect-square rounded-xl text-xs font-bold transition-all ${isSel ? 'bg-emerald-600 text-white scale-110 shadow-lg' : 'bg-slate-50'} ${hasS && !isSel ? 'text-emerald-600 ring-2 ring-emerald-100' : 'text-slate-400'}`}>{d.getDate()}</button>
                                    })}
                                </div>
                            </div>
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                                <div className="flex justify-between items-start mb-10">
                                    <h3 className="font-serif font-bold text-xl">{adminSelectedDate.toLocaleDateString('fr-FR', { day:'numeric', month:'long' })}</h3>
                                    <button onClick={async () => {
                                        const s = getDateStr(adminSelectedDate);
                                        const m = { ...dailySlots };
                                        if (m[s]) delete m[s]; else m[s] = ["09:00", "10:30", "14:00", "15:30"];
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('availability').set({ slots: m });
                                    }} className={`w-12 h-6 rounded-full relative transition-colors ${dailySlots[getDateStr(adminSelectedDate)] ? 'bg-emerald-500' : 'bg-slate-200'}`}><div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${dailySlots[getDateStr(adminSelectedDate)] ? 'left-7' : 'left-1'}`}></div></button>
                                </div>
                                {dailySlots[getDateStr(adminSelectedDate)] ? (
                                    <div className="grid grid-cols-3 gap-2 animate-in slide-in-from-top-4">
                                        {dailySlots[getDateStr(adminSelectedDate)].map((t, idx) => (
                                            <div key={idx} className="p-4 bg-slate-50 rounded-2xl text-xs font-black text-center border border-slate-100 text-slate-600">{t}</div>
                                        ))}
                                    </div>
                                ) : <p className="text-center py-10 text-slate-300 italic">Journée fermée au public.</p>}
                            </div>
                        </div>
                    )}
                    
                    {adminSubView === 'settings' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                                <h3 className="font-serif font-bold text-xl mb-4 flex items-center gap-2 text-emerald-700"><Icon name="message-square" /> Numéro WhatsApp</h3>
                                <p className="text-[10px] uppercase font-black text-slate-400 mb-6 tracking-widest">Utilisé pour les notifications clients</p>
                                <input type="text" className="w-full p-5 bg-slate-50 border-none rounded-2xl font-bold text-lg outline-none focus:ring-2 focus:ring-emerald-500/20" value={businessSettings.whatsapp} onChange={async (e) => {
                                    const val = e.target.value;
                                    setBusinessSettings(p => ({ ...p, whatsapp: val }));
                                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('config').set({ ...businessSettings, whatsapp: val });
                                }} placeholder="33612345678" />
                                <p className="text-[9px] text-slate-400 mt-4 italic">Format international sans le + (Ex: 33 pour la France)</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
