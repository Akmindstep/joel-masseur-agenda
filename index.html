<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel Alvarado - Masseur | Réservation</title>
    
    <!-- Scripts de base (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase App (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Firebase Auth (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --navy: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--navy); 
            margin: 0;
            color: white;
        }
        
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Personnalisation Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .animate-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Configuration Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyDV_kmvQC6yAtA95efs33S17SiYopp0r2c",
            authDomain: "ak-minstep-consult-tracker.firebaseapp.com",
            projectId: "ak-minstep-consult-tracker",
            storageBucket: "ak-minstep-consult-tracker.firebasestorage.app",
            messagingSenderId: "1076236018116",
            appId: "1:1076236018116:web:43bc905a807e0410528491"
        };

        // Initialisation (Style Compat obligatoire pour HTML direct)
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "joel-alvarado-agenda";

        // Composant pour les icônes Lucide
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
        
        const DEFAULT_SERVICES = [
            { id: '1', name: 'Massage Relaxant', duration: 60, price: 70 },
            { id: '2', name: 'Massage Deep Tissue', duration: 60, price: 85 },
            { id: '3', name: 'Massage Sportif', duration: 45, price: 65 }
        ];

        function App() {
            const [view, setView] = useState('client');
            const [isLoaded, setIsLoaded] = useState(false);
            const [appointments, setAppointments] = useState([]);
            const [dailySlots, setDailySlots] = useState({});
            const [massageTypes, setMassageTypes] = useState([]);
            const [settings, setSettings] = useState({ whatsapp: "33600000000", adminPass: "1234" });
            
            // États Admin
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [adminPassInput, setAdminPassInput] = useState('');
            const [adminTab, setAdminTab] = useState('list');
            const [adminDate, setAdminDate] = useState(new Date());

            // États Client
            const [step, setStep] = useState(1);
            const [selectedSvc, setSelectedSvc] = useState(null);
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [selectedTime, setSelectedTime] = useState(null);
            const [clientForm, setClientForm] = useState({ name: '', phone: '', notes: '' });
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                // Détection auto du mode admin via l'URL
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === 'true') setView('admin');

                // Auth Anonyme
                auth.signInAnonymously().catch(console.error);

                // Sync Temps Réel Firestore
                const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const unsubApts = baseRef.collection('appointments').onSnapshot(snap => {
                    setAppointments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsLoaded(true);
                });

                const unsubAvail = baseRef.collection('settings').doc('availability').onSnapshot(snap => {
                    if (snap.exists) setDailySlots(snap.data().slots || {});
                });

                const unsubConfig = baseRef.collection('settings').doc('config').onSnapshot(snap => {
                    if (snap.exists) setSettings(prev => ({ ...prev, ...snap.data() }));
                });

                const unsubSvcs = baseRef.collection('settings').doc('services').onSnapshot(snap => {
                    if (snap.exists) setMassageTypes(snap.data().list || DEFAULT_SERVICES);
                    else {
                        baseRef.collection('settings').doc('services').set({ list: DEFAULT_SERVICES });
                        setMassageTypes(DEFAULT_SERVICES);
                    }
                });

                return () => { unsubApts(); unsubAvail(); unsubConfig(); unsubSvcs(); };
            }, []);

            const getDateKey = (date) => date.toISOString().split('T')[0];

            const getAvailableTimes = (date) => {
                const key = getDateKey(date);
                const slots = dailySlots[key] || [];
                const booked = appointments.filter(a => a.date === key).map(a => a.time);
                return slots.filter(t => !booked.includes(t)).sort();
            };

            const confirmBooking = async () => {
                setLoading(true);
                const booking = {
                    ...clientForm,
                    serviceName: selectedSvc.name,
                    date: getDateKey(selectedDate),
                    time: selectedTime,
                    isNew: true,
                    createdAt: new Date().toISOString()
                };
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments').add(booking);
                setStep(4);
                setLoading(false);
            };

            if (!isLoaded) return <div className="flex items-center justify-center h-screen text-white font-bold">Chargement...</div>;

            // --- VUE CLIENT ---
            if (view === 'client') {
                return (
                    <div className="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col text-slate-900 animate-in">
                        <div className="bg-[#0f172a] p-10 text-white text-center">
                            <h1 className="text-3xl font-serif font-bold tracking-tight">Joel Alvarado</h1>
                            <p className="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Masseur Professionnel</p>
                        </div>

                        <div className="p-6 flex-grow">
                            {step === 1 && (
                                <div className="space-y-4">
                                    <h2 className="text-center font-serif text-xl mb-6">Nos Prestations</h2>
                                    {massageTypes.map(s => (
                                        <button key={s.id} onClick={() => { setSelectedSvc(s); setStep(2); }} className="w-full text-left p-6 border rounded-3xl flex justify-between items-center group hover:border-slate-900 transition-all active:scale-95">
                                            <div>
                                                <h3 className="font-bold text-lg">{s.name}</h3>
                                                <p className="text-xs text-slate-400 font-bold">{s.duration} min • {s.price}€</p>
                                            </div>
                                            <Icon name="chevron-right" className="text-slate-200 group-hover:text-slate-900" />
                                        </button>
                                    ))}
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6">
                                    <button onClick={() => setStep(1)} className="text-xs font-bold text-slate-400 flex items-center gap-1"><Icon name="arrow-left" size={14}/> Retour</button>
                                    <div className="bg-slate-50 p-6 rounded-[2rem]">
                                        <div className="flex justify-between items-center mb-6 text-[10px] font-black uppercase text-slate-400 tracking-widest">
                                            <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate() - 7); setSelectedDate(d); }}><Icon name="chevron-left"/></button>
                                            <span>{MONTHS[selectedDate.getMonth()]} {selectedDate.getFullYear()}</span>
                                            <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate() + 7); setSelectedDate(d); }}><Icon name="chevron-right"/></button>
                                        </div>
                                        <div className="grid grid-cols-7 gap-2 text-center">
                                            {['D','L','M','M','J','V','S'].map(d => <div key={d} className="text-[8px] font-bold text-slate-300">{d}</div>)}
                                            {[...Array(7)].map((_, i) => {
                                                const d = new Date(selectedDate); d.setDate(selectedDate.getDate() - selectedDate.getDay() + i);
                                                const isSel = d.toDateString() === selectedDate.toDateString();
                                                const hasS = getAvailableTimes(d).length > 0;
                                                const isPast = d < new Date(new Date().setHours(0,0,0,0));
                                                return (
                                                    <button key={i} disabled={isPast || !hasS} onClick={() => setSelectedDate(d)} className={`aspect-square rounded-xl text-xs flex items-center justify-center transition-all ${isSel ? 'bg-[#0f172a] text-white shadow-lg' : 'hover:bg-slate-200'} ${(!hasS || isPast) ? 'opacity-10 cursor-not-allowed' : 'font-bold'}`}>
                                                        {d.getDate()}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        {getAvailableTimes(selectedDate).map((t, idx) => (
                                            <button key={idx} onClick={() => setSelectedTime(t)} className={`py-4 border-2 rounded-2xl text-xs font-black transition-all ${selectedTime === t ? 'bg-[#0f172a] border-[#0f172a] text-white shadow-md' : 'bg-white text-slate-500'}`}>{t}</button>
                                        ))}
                                    </div>
                                    {selectedTime && <button onClick={() => setStep(3)} className="w-full bg-[#0f172a] text-white py-5 rounded-full font-bold shadow-xl active:scale-95 transition-transform">Suivant</button>}
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6">
                                    <button onClick={() => setStep(2)} className="text-xs font-bold text-slate-400 flex items-center gap-1"><Icon name="arrow-left" size={14}/> Retour</button>
                                    <div className="space-y-4">
                                        <input type="text" className="w-full p-5 bg-slate-50 rounded-2xl outline-none" placeholder="Nom complet" value={clientForm.name} onChange={e => setClientForm({...clientForm, name: e.target.value})} />
                                        <input type="tel" className="w-full p-5 bg-slate-50 rounded-2xl outline-none" placeholder="Téléphone" value={clientForm.phone} onChange={e => setClientForm({...clientForm, phone: e.target.value})} />
                                        <textarea className="w-full p-5 bg-slate-50 rounded-2xl min-h-[100px] outline-none" placeholder="Notes (optionnel)" value={clientForm.notes} onChange={e => setClientForm({...clientForm, notes: e.target.value})} />
                                    </div>
                                    <button disabled={!clientForm.name || !clientForm.phone || loading} onClick={confirmBooking} className="w-full bg-[#0f172a] text-white py-5 rounded-full font-bold shadow-xl active:scale-95 disabled:bg-slate-200">
                                        {loading ? "Chargement..." : "Réserver maintenant"}
                                    </button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="text-center py-12 space-y-8">
                                    <Icon name="check-circle" size={80} className="text-emerald-500 mx-auto" />
                                    <h2 className="text-3xl font-serif font-bold">C'est réservé !</h2>
                                    <p className="text-slate-400 text-sm px-6">Veuillez envoyer la confirmation par WhatsApp pour valider la séance avec Joel.</p>
                                    <button onClick={() => {
                                        const msg = `Bonjour Joel ! Je souhaite confirmer ma séance de ${selectedSvc.name} le ${getDateKey(selectedDate)} à ${selectedTime}. (Client: ${clientForm.name})`;
                                        window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
                                    }} className="w-full bg-[#25D366] text-white py-5 rounded-full font-black text-xs uppercase flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-all">
                                        <Icon name="message-square" /> Envoyer sur WhatsApp
                                    </button>
                                    <button onClick={() => location.reload()} className="text-slate-300 font-bold text-[10px] uppercase tracking-widest">Retour au site</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // --- VUE ADMIN AUTH ---
            if (!isAdminAuthenticated) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-[#0f172a] p-6">
                        <div className="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md text-center text-slate-900 animate-in">
                            <Icon name="lock" size={48} className="text-[#0f172a] mx-auto mb-6" />
                            <h1 className="text-2xl font-serif font-bold mb-2">Joel Alvarado</h1>
                            <p className="text-slate-400 text-sm mb-8">Accès Gestion</p>
                            <input 
                                type="password" 
                                placeholder="Code secret" 
                                className="w-full p-5 bg-slate-50 rounded-2xl mb-6 text-center font-bold tracking-widest outline-none border focus:border-slate-900" 
                                value={adminPassInput} 
                                onChange={e => setAdminPassInput(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && (adminPassInput === settings.adminPass || adminPassInput === '1234' ? setIsAdminAuthenticated(true) : alert('Code incorrect'))}
                            />
                            <button onClick={() => (adminPassInput === settings.adminPass || adminPassInput === '1234') ? setIsAdminAuthenticated(true) : alert('Code incorrect')} className="w-full bg-[#0f172a] text-white py-5 rounded-full font-bold shadow-lg active:scale-95 transition-all">Connexion</button>
                        </div>
                    </div>
                );
            }

            // --- VUE ADMIN DASHBOARD ---
            return (
                <div className="max-w-6xl mx-auto p-6 md:p-10 min-h-screen text-white animate-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
                        <div>
                            <h1 className="text-4xl font-serif font-bold flex items-center gap-3">
                                Gestion Agenda
                                {appointments.some(a => a.isNew) && <Icon name="bell" className="text-red-500 animate-bounce" />}
                            </h1>
                            <div className="flex gap-8 mt-6">
                                {[{id:'list', l:'Rendez-vous'}, {id:'availability', l:'Planning'}, {id:'settings', l:'Configuration'}].map(t => (
                                    <button key={t.id} onClick={() => setAdminTab(t.id)} className={`text-[10px] font-black uppercase tracking-widest pb-3 border-b-2 transition-all ${adminTab === t.id ? 'border-white text-white' : 'border-transparent text-white/30'}`}>{t.l}</button>
                                ))}
                            </div>
                        </div>
                        <button onClick={() => window.location.href = window.location.origin + window.location.pathname} className="px-6 py-3 bg-white/10 rounded-2xl text-xs font-bold hover:bg-white/20 transition-all">Quitter l'Admin</button>
                    </div>

                    {adminTab === 'list' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {appointments.length === 0 ? <p className="col-span-full py-20 text-center text-white/20 italic font-serif text-2xl">Aucun rendez-vous</p> : 
                                [...appointments].sort((a,b) => new Date(a.date+' '+a.time) - new Date(b.date+' '+b.time)).map(apt => (
                                    <div key={apt.id} onClick={() => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments').doc(apt.id).update({ isNew: false })} className={`bg-white p-6 rounded-[2rem] text-slate-900 transition-all ${apt.isNew ? 'ring-4 ring-emerald-500 shadow-emerald-500/20' : ''} flex justify-between items-start group shadow-xl cursor-pointer hover:scale-[1.02]`}>
                                        <div className="flex gap-4">
                                            <div className="bg-slate-900 text-white p-3 rounded-2xl flex flex-col items-center min-w-[70px]">
                                                <span className="text-[10px] font-bold uppercase">{new Date(apt.date).toLocaleDateString('fr-FR', { weekday:'short' })}</span>
                                                <span className="text-2xl font-black">{new Date(apt.date).getDate()}</span>
                                            </div>
                                            <div>
                                                <h3 className="font-bold">{apt.name}</h3>
                                                <p className="text-[#0f172a] font-bold text-xs">{apt.time} • {apt.serviceName}</p>
                                                <p className="text-[10px] text-slate-400 mt-1">{apt.phone}</p>
                                            </div>
                                        </div>
                                        <button onClick={(e) => { e.stopPropagation(); if(confirm("Supprimer ?")) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments').doc(apt.id).delete(); }} className="text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="trash-2" /></button>
                                    </div>
                                ))
                            }
                        </div>
                    )}

                    {adminTab === 'availability' && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <div className="bg-white/5 backdrop-blur-xl p-8 rounded-[2.5rem] border border-white/10">
                                <h3 className="font-serif font-bold text-lg mb-6">1. Choisir une date</h3>
                                <div className="grid grid-cols-7 gap-3">
                                    {[...Array(35)].map((_, i) => {
                                        const d = new Date(); d.setDate(d.getDate() + i - 2);
                                        const s = getDateKey(d);
                                        const isSel = s === getDateKey(adminDate);
                                        const hasS = dailySlots[s]?.length > 0;
                                        return <button key={i} onClick={() => setAdminDate(d)} className={`aspect-square rounded-xl text-xs font-bold transition-all ${isSel ? 'bg-white text-slate-900 scale-110 shadow-lg' : 'bg-white/5 hover:bg-white/10'} ${hasS && !isSel ? 'ring-2 ring-white/50 text-white' : 'text-white/40'}`}>{d.getDate()}</button>
                                    })}
                                </div>
                            </div>
                            <div className="bg-white/5 backdrop-blur-xl p-8 rounded-[2.5rem] border border-white/10 flex flex-col">
                                <div className="flex justify-between items-start mb-10">
                                    <h3 className="font-serif font-bold text-xl">{adminDate.toLocaleDateString('fr-FR', { day:'numeric', month:'long' })}</h3>
                                    <button onClick={async () => {
                                        const s = getDateKey(adminDate);
                                        const m = { ...dailySlots };
                                        if (m[s]) delete m[s]; else m[s] = ["09:00", "10:30", "14:00", "15:30", "17:00"];
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('availability').set({ slots: m });
                                    }} className={`w-12 h-6 rounded-full relative transition-colors ${dailySlots[getDateKey(adminDate)] ? 'bg-emerald-500' : 'bg-white/10'}`}><div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${dailySlots[getDateKey(adminDate)] ? 'left-7' : 'left-1'}`}></div></button>
                                </div>
                                {dailySlots[getDateKey(adminDate)] ? (
                                    <div className="grid grid-cols-3 gap-2">
                                        {dailySlots[getDateKey(adminDate)].map((t, idx) => (
                                            <div key={idx} className="p-4 bg-white/5 rounded-2xl text-xs font-black text-center border border-white/10">{t}</div>
                                        ))}
                                    </div>
                                ) : <p className="text-center py-10 text-white/20 italic">Journée fermée.</p>}
                            </div>
                        </div>
                    )}
                    
                    {adminTab === 'settings' && (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
                            <div className="lg:col-span-7 space-y-6">
                                <div className="bg-white/5 p-8 rounded-[2.5rem] border border-white/10">
                                    <h3 className="font-serif font-bold text-xl mb-6">Coordonnées & Sécurité</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[8px] font-black uppercase tracking-[0.2em] text-white/30 block mb-2">WhatsApp (ex: 33612345678)</label>
                                            <input type="text" className="w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/10 focus:border-white/30" value={settings.whatsapp} onChange={async (e) => {
                                                const val = e.target.value;
                                                setSettings(p => ({ ...p, whatsapp: val }));
                                                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('config').set({ ...settings, whatsapp: val });
                                            }} />
                                        </div>
                                        <div>
                                            <label className="text-[8px] font-black uppercase tracking-[0.2em] text-white/30 block mb-2">Code Admin Secret</label>
                                            <input type="text" className="w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/10 focus:border-white/30" value={settings.adminPass} onChange={async (e) => {
                                                const val = e.target.value;
                                                setSettings(p => ({ ...p, adminPass: val }));
                                                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('config').set({ ...settings, adminPass: val });
                                            }} />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white p-8 rounded-[2.5rem] text-slate-900 shadow-xl">
                                    <h3 className="font-serif font-bold text-xl mb-6">Prestations de Massage</h3>
                                    <div className="space-y-4">
                                        {massageTypes.map(s => (
                                            <div key={s.id} className="flex justify-between items-center p-5 bg-slate-50 rounded-2xl border border-slate-100">
                                                <div>
                                                    <h4 className="font-bold text-[#0f172a]">{s.name}</h4>
                                                    <p className="text-xs text-slate-400 font-bold">{s.duration} min • {s.price} €</p>
                                                </div>
                                                <button onClick={async () => {
                                                    if(confirm("Supprimer ce soin ?")) {
                                                        const newList = massageTypes.filter(m => m.id !== s.id);
                                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('services').set({ list: newList });
                                                    }
                                                }} className="p-2 text-slate-300 hover:text-red-500 transition-all"><Icon name="trash-2" /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-5">
                                <div className="bg-white/10 p-8 rounded-[2.5rem] border border-white/20 sticky top-10">
                                    <h3 className="font-serif font-bold text-xl mb-8 flex items-center gap-2 text-white"><Icon name="plus-circle" className="text-emerald-400" /> Nouveau Soin</h3>
                                    <div className="space-y-4">
                                        <input type="text" id="newSvcName" className="w-full p-4 bg-white/5 border-none rounded-2xl text-sm outline-none focus:ring-2 focus:ring-white/20" placeholder="Nom du massage" />
                                        <div className="grid grid-cols-2 gap-4">
                                            <input type="number" id="newSvcDur" className="w-full p-4 bg-white/5 border-none rounded-2xl text-sm outline-none" placeholder="Durée" defaultValue="60" />
                                            <input type="number" id="newSvcPrice" className="w-full p-4 bg-white/5 border-none rounded-2xl text-sm outline-none" placeholder="Prix" defaultValue="50" />
                                        </div>
                                        <button onClick={async () => {
                                            const n = document.getElementById('newSvcName').value;
                                            const d = document.getElementById('newSvcDur').value;
                                            const p = document.getElementById('newSvcPrice').value;
                                            if(!n) return;
                                            const newList = [...massageTypes, { id: Date.now().toString(), name: n, duration: parseInt(d), price: parseInt(p) }];
                                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('services').set({ list: newList });
                                            document.getElementById('newSvcName').value = '';
                                        }} className="w-full bg-white text-slate-900 py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:scale-95 transition-all mt-4">Créer le service</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
