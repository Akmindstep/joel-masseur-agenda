<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel Alvarado - Masseur | Réservation</title>
    
    <!-- CSS et Polices -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; color: white; min-height: 100vh; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .bg-card { background-color: white; color: #0f172a; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <!-- Scripts React et Firebase (Versions stables) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURATION FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDV_kmvQC6yAtA95efs33S17SiYopp0r2c",
            authDomain: "ak-minstep-consult-tracker.firebaseapp.com",
            projectId: "ak-minstep-consult-tracker",
            storageBucket: "ak-minstep-consult-tracker.firebasestorage.app",
            messagingSenderId: "1076236018116",
            appId: "1:1076236018116:web:43bc905a807e0410528491"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "joel-alvarado-agenda";

        // --- COMPOSANT ICONE ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        // --- APP PRINCIPALE ---
        function App() {
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [isLoaded, setIsLoaded] = useState(false);
            
            const [appointments, setAppointments] = useState([]);
            const [dailySlots, setDailySlots] = useState({});
            const [massageTypes, setMassageTypes] = useState([]);
            const [settings, setSettings] = useState({ whatsapp: "33600000000", adminPass: "1234" });

            // Navigation Client
            const [step, setStep] = useState(1);
            const [selSvc, setSelSvc] = useState(null);
            const [selDate, setSelDate] = useState(new Date());
            const [selTime, setSelTime] = useState(null);
            const [form, setForm] = useState({ name: '', phone: '' });

            // Navigation Admin
            const [adminTab, setAdminTab] = useState('list');
            const [passInput, setPassInput] = useState('');

            useEffect(() => {
                // Détection immédiate du mode via l'URL
                const params = new URLSearchParams(window.location.search);
                setIsAdminMode(params.get('admin') === 'true');

                // Auth Anonyme pour accès aux données
                auth.signInAnonymously().catch(console.error);

                // Connexion Temps Réel
                const dataRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const unsubApts = dataRef.collection('appointments').onSnapshot(s => {
                    setAppointments(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsLoaded(true);
                });

                const unsubAvail = dataRef.collection('settings').doc('availability').onSnapshot(s => {
                    if (s.exists) setDailySlots(s.data().slots || {});
                });

                const unsubSvcs = dataRef.collection('settings').doc('services').onSnapshot(s => {
                    if (s.exists) setMassageTypes(s.data().list || []);
                    else setMassageTypes([
                        { id: '1', name: 'Massage Relaxant', duration: 60, price: 70 },
                        { id: '2', name: 'Deep Tissue', duration: 60, price: 85 }
                    ]);
                });

                const unsubConf = dataRef.collection('settings').doc('config').onSnapshot(s => {
                    if (s.exists) setSettings(prev => ({ ...prev, ...s.data() }));
                });

                return () => { unsubApts(); unsubAvail(); unsubSvcs(); unsubConf(); };
            }, []);

            const getDateStr = (d) => d.toISOString().split('T')[0];

            // --- VUE CLIENT ---
            if (!isAdminMode) {
                return (
                    <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col text-slate-900 animate-in">
                        <div className="bg-[#0f172a] p-10 text-white text-center shadow-lg">
                            <h1 className="text-3xl font-serif font-bold">Joel Alvarado</h1>
                            <p className="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Masseur Professionnel</p>
                        </div>

                        <div className="p-6 flex-grow overflow-y-auto no-scrollbar">
                            {step === 1 && (
                                <div className="space-y-4">
                                    <h2 className="text-center font-serif text-xl mb-8">Choisissez votre soin</h2>
                                    {massageTypes.map(s => (
                                        <button key={s.id} onClick={() => { setSelSvc(s); setStep(2); }} className="w-full text-left p-6 border rounded-3xl flex justify-between items-center group active:scale-95 shadow-sm">
                                            <div>
                                                <h3 className="font-bold text-lg">{s.name}</h3>
                                                <p className="text-xs text-slate-400">{s.duration} min • {s.price}€</p>
                                            </div>
                                            <Icon name="chevron-right" className="text-slate-200 group-hover:text-[#0f172a]" />
                                        </button>
                                    ))}
                                </div>
                            )}

                            {step === 2 && (
                                <div className="space-y-6">
                                    <button onClick={() => setStep(1)} className="text-xs font-bold text-slate-400"><Icon name="arrow-left" size={14}/> Retour</button>
                                    <div className="bg-slate-50 p-6 rounded-[2rem]">
                                        <div className="flex justify-between items-center mb-6 text-[10px] font-black uppercase text-slate-400 tracking-widest px-2">
                                            <button onClick={() => { const d = new Date(selDate); d.setDate(d.getDate() - 7); setSelDate(d); }}><Icon name="chevron-left"/></button>
                                            <span>Semaine du {selDate.getDate()}</span>
                                            <button onClick={() => { const d = new Date(selDate); d.setDate(d.getDate() + 7); setSelDate(d); }}><Icon name="chevron-right"/></button>
                                        </div>
                                        <div className="grid grid-cols-7 gap-2">
                                            {[...Array(7)].map((_, i) => {
                                                const d = new Date(selDate); d.setDate(selDate.getDate() - selDate.getDay() + i);
                                                const isSel = d.toDateString() === selDate.toDateString();
                                                const hasS = (dailySlots[getDateStr(d)] || []).length > 0;
                                                const isPast = d < new Date(new Date().setHours(0,0,0,0));
                                                return (
                                                    <button key={i} disabled={isPast || !hasS} onClick={() => setSelDate(d)} className={`aspect-square flex items-center justify-center rounded-2xl text-xs transition-all ${isSel ? 'bg-[#0f172a] text-white shadow-lg' : 'hover:bg-slate-200'} ${(!hasS || isPast) ? 'opacity-10 cursor-not-allowed' : 'font-bold'}`}>
                                                        {d.getDate()}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        {(dailySlots[getDateStr(selDate)] || []).map((t, idx) => (
                                            <button key={idx} onClick={() => setSelTime(t)} className={`py-4 border-2 rounded-2xl text-xs font-black transition-all ${selTime === t ? 'bg-[#0f172a] border-[#0f172a] text-white shadow-md' : 'bg-white text-slate-500'}`}>{t}</button>
                                        ))}
                                    </div>
                                    {selTime && <button onClick={() => setStep(3)} className="w-full bg-[#0f172a] text-white py-5 rounded-full font-bold shadow-xl active:scale-95 transition-all">Continuer</button>}
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6">
                                    <button onClick={() => setStep(2)} className="text-xs font-bold text-slate-400"><Icon name="arrow-left" size={14}/> Retour</button>
                                    <div className="space-y-4">
                                        <input type="text" className="w-full p-5 bg-slate-50 rounded-2xl outline-none" placeholder="Nom complet" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                                        <input type="tel" className="w-full p-5 bg-slate-50 rounded-2xl outline-none" placeholder="Téléphone" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
                                    </div>
                                    <button disabled={!form.name || !form.phone} onClick={async () => {
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments').add({
                                            ...form, serviceName: selSvc.name, date: getDateStr(selDate), time: selTime, isNew: true, createdAt: new Date().toISOString()
                                        });
                                        setStep(4);
                                    }} className="w-full bg-[#0f172a] text-white py-5 rounded-full font-bold shadow-xl active:scale-95 transition-all disabled:bg-slate-200">Confirmer la séance</button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="text-center py-16 space-y-8">
                                    <Icon name="check-circle" size={80} className="text-emerald-500 mx-auto" />
                                    <h2 className="text-3xl font-serif font-bold">Réservé !</h2>
                                    <p className="text-slate-400 text-sm px-6">Pour finaliser, cliquez sur le bouton ci-dessous pour m'envoyer la confirmation via WhatsApp.</p>
                                    <button onClick={() => {
                                        const msg = `Bonjour Joel ! Je confirme ma séance de ${selSvc.name} le ${getDateStr(selDate)} à ${selTime}. (Client: ${form.name})`;
                                        window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
                                    }} className="w-full bg-[#25D366] text-white py-5 rounded-full font-black text-xs uppercase flex items-center justify-center gap-3 shadow-xl active:scale-95">
                                        <Icon name="message-square" /> Envoyer sur WhatsApp
                                    </button>
                                    <button onClick={() => location.reload()} className="text-slate-300 font-bold text-[10px] uppercase tracking-widest">Retour</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // --- VUE ADMIN ---
            if (!isAdminAuth) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-6">
                        <div className="bg-white p-12 rounded-[3.5rem] shadow-2xl w-full max-w-md text-center text-slate-900 animate-in">
                            <Icon name="lock" size={56} className="text-[#0f172a] mx-auto mb-6" />
                            <h1 className="text-2xl font-serif font-bold mb-10">Joel Alvarado Admin</h1>
                            <input type="password" placeholder="Code secret" className="w-full p-5 bg-slate-50 rounded-2xl mb-4 text-center font-bold tracking-[0.5em] outline-none border-2" value={passInput} onChange={e => setPassInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && (passInput === settings.adminPass || passInput === '1234' ? setIsAdminAuth(true) : alert('Code incorrect'))} />
                            <button onClick={() => (passInput === settings.adminPass || passInput === '1234') ? setIsAdminAuth(true) : alert('Code incorrect')} className="w-full bg-[#0f172a] text-white py-5 rounded-full font-bold shadow-lg active:scale-95">Connexion</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto p-6 md:p-12 animate-in text-white">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
                        <div>
                            <h1 className="text-4xl font-serif font-bold">Gestion Agenda</h1>
                            <div className="flex gap-8 mt-6">
                                {[{id:'list', l:'Rendez-vous'}, {id:'availability', l:'Planning'}, {id:'settings', l:'Soins'}].map(t => (
                                    <button key={t.id} onClick={() => setAdminTab(t.id)} className={`text-[10px] font-black uppercase tracking-widest pb-3 border-b-2 transition-all ${adminTab === t.id ? 'border-white text-white' : 'border-transparent text-white/30'}`}>{t.l}</button>
                                ))}
                            </div>
                        </div>
                        <button onClick={() => window.location.href = window.location.origin + window.location.pathname} className="px-5 py-3 bg-white/10 rounded-2xl text-xs font-bold border border-white/10 hover:bg-white/20">Quitter</button>
                    </div>

                    {adminTab === 'list' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {appointments.sort((a,b) => new Date(a.date+' '+a.time) - new Date(b.date+' '+b.time)).map(apt => (
                                <div key={apt.id} className="bg-white p-6 rounded-[2.5rem] text-slate-900 shadow-xl flex justify-between items-start">
                                    <div className="flex gap-4">
                                        <div className="bg-[#0f172a] text-white p-4 rounded-3xl flex flex-col items-center min-w-[70px]">
                                            <span className="text-2xl font-black">{new Date(apt.date).getDate()}</span>
                                        </div>
                                        <div>
                                            <h3 className="font-bold">{apt.name}</h3>
                                            <p className="text-xs font-bold">{apt.time} • {apt.serviceName}</p>
                                            <p className="text-[10px] text-slate-400 mt-1">{apt.phone}</p>
                                        </div>
                                    </div>
                                    <button onClick={async () => { if(confirm("Supprimer ?")) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('appointments').doc(apt.id).delete(); }} className="p-2 text-slate-200 hover:text-red-500 transition-colors"><Icon name="trash-2" /></button>
                                </div>
                            ))}
                        </div>
                    )}

                    {adminTab === 'availability' && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <div className="bg-white/5 p-8 rounded-[3rem] border border-white/10">
                                <div className="grid grid-cols-7 gap-3 text-center">
                                    {[...Array(30)].map((_, i) => {
                                        const d = new Date(); d.setDate(d.getDate() + i);
                                        const s = getDateStr(d);
                                        const isSel = s === getDateStr(adminDate);
                                        const hasS = (dailySlots[s] || []).length > 0;
                                        return <button key={i} onClick={() => setAdminDate(d)} className={`aspect-square rounded-2xl text-xs font-black transition-all ${isSel ? 'bg-white text-slate-900 scale-110 shadow-lg' : 'bg-white/5 hover:bg-white/10 text-white/60'} ${hasS && !isSel ? 'ring-2 ring-white/50 text-white' : ''}`}>{d.getDate()}</button>
                                    })}
                                </div>
                            </div>
                            <div className="bg-white/5 p-8 rounded-[3rem] border border-white/10 flex flex-col">
                                <div className="flex justify-between items-start mb-12">
                                    <h3 className="font-serif font-bold text-2xl">{adminDate.toLocaleDateString('fr-FR', { day:'numeric', month:'long' })}</h3>
                                    <button onClick={async () => {
                                        const s = getDateStr(adminDate);
                                        const m = { ...dailySlots };
                                        if (m[s]) delete m[s]; else m[s] = ["09:00", "10:30", "14:00", "15:30", "17:00"];
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('availability').set({ slots: m });
                                    }} className={`w-14 h-7 rounded-full relative transition-colors ${dailySlots[getDateStr(adminDate)] ? 'bg-emerald-500' : 'bg-white/10'}`}><div className={`absolute top-1 w-5 h-5 bg-white rounded-full transition-all ${dailySlots[getDateStr(adminDate)] ? 'left-8' : 'left-1'}`}></div></button>
                                </div>
                                {dailySlots[getDateStr(adminDate)] && (
                                    <div className="grid grid-cols-3 gap-3">
                                        {dailySlots[getDateStr(adminDate)].map((t, idx) => (
                                            <div key={idx} className="p-4 bg-white/5 rounded-2xl text-xs font-black text-center border border-white/5 text-white/80">{t}</div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {adminTab === 'settings' && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <div className="bg-white/5 p-10 rounded-[3rem] border border-white/10 shadow-2xl space-y-8">
                                <h3 className="font-serif font-bold text-2xl text-emerald-400">Configuration</h3>
                                <div>
                                    <label className="text-[10px] font-black uppercase text-white/40 block mb-3">WhatsApp (ex: 336...)</label>
                                    <input type="text" className="w-full p-5 bg-white/5 rounded-2xl outline-none border border-white/10 focus:border-emerald-500/50" value={settings.whatsapp} onChange={async e => {
                                        const v = e.target.value; setSettings(p => ({...p, whatsapp: v}));
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('config').set({ ...settings, whatsapp: v });
                                    }} />
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase text-white/40 block mb-3">Code Secret Admin</label>
                                    <input type="text" className="w-full p-5 bg-white/5 rounded-2xl outline-none border border-white/10 focus:border-emerald-500/50" value={settings.adminPass} onChange={async e => {
                                        const v = e.target.value; setSettings(p => ({...p, adminPass: v}));
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('config').set({ ...settings, adminPass: v });
                                    }} />
                                </div>
                                <div className="space-y-4 pt-8 border-t border-white/10">
                                    <h4 className="font-serif font-bold text-xl text-white">Prestations Actuelles</h4>
                                    {massageTypes.map(s => (
                                        <div key={s.id} className="flex justify-between items-center p-5 bg-white/5 rounded-2xl border border-white/10">
                                            <div>
                                                <p className="font-bold">{s.name}</p>
                                                <p className="text-[10px] text-white/40">{s.duration} min • {s.price}€</p>
                                            </div>
                                            <button onClick={async () => { if(confirm("Supprimer ?")) {
                                                const newList = massageTypes.filter(m => m.id !== s.id);
                                                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('services').set({ list: newList });
                                            }}} className="p-2 text-white/20 hover:text-red-500 transition-colors"><Icon name="trash-2" /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-emerald-600 p-10 rounded-[3.5rem] text-white shadow-2xl sticky top-10 border-4 border-emerald-500">
                                <h3 className="font-serif font-bold text-2xl mb-10">Ajouter un Soin</h3>
                                <div className="space-y-6">
                                    <input type="text" id="nsN" className="w-full p-5 bg-white/10 border-none rounded-3xl outline-none" placeholder="Nom du massage" />
                                    <div className="grid grid-cols-2 gap-6">
                                        <input type="number" id="nsD" className="w-full p-5 bg-white/10 border-none rounded-3xl outline-none" placeholder="Durée" defaultValue="60" />
                                        <input type="number" id="nsP" className="w-full p-5 bg-white/10 border-none rounded-3xl outline-none" placeholder="Prix" defaultValue="50" />
                                    </div>
                                    <button onClick={async () => {
                                        const n = document.getElementById('nsN').value; const d = document.getElementById('nsD').value; const p = document.getElementById('nsP').value;
                                        if(!n) return;
                                        const newList = [...massageTypes, { id: Date.now().toString(), name: n, duration: parseInt(d), price: parseInt(p) }];
                                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings').doc('services').set({ list: newList });
                                        document.getElementById('nsN').value = '';
                                    }} className="w-full bg-white text-[#0f172a] py-6 rounded-[2rem] font-black text-xs uppercase shadow-xl hover:bg-slate-100 transition-all mt-6">Enregistrer le Soin</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
